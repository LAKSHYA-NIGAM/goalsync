services:
  - type: web
    name: goalsync
    runtime: node
    rootDir: .
    buildCommand: npm run build && cd server && npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: NODE_ENV
        value: production
    plan: free
